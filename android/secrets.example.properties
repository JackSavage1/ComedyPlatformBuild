# =============================================================================
# Template for android/secrets.properties (which is gitignored).
#
#   cp android/secrets.example.properties android/secrets.properties
#
# Then fill in your project's values from the Supabase dashboard
# (Project Settings → API / Data API / API Keys). See docs/MOBILE_SETUP.md,
# steps 5 and 7. Plain https:// is fine here (unlike the iOS .xcconfig).
#
# Use the ANON / publishable key only. NEVER the service_role key.
# If this file is missing the app still builds and shows "Not configured".
# =============================================================================

SUPABASE_URL=https://YOUR-PROJECT-REF.supabase.co
SUPABASE_ANON_KEY=eyJ...your anon key...
