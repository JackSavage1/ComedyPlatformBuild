# Gradle settings for the whole Android build.

# Give the Gradle daemon enough memory for Compose + MapLibre builds.
# The Kotlin compile daemon gets its own (smaller) heap; otherwise it copies the
# Gradle daemon's -Xmx and the two together can exceed a 7 GB CI runner.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX libraries (required by Compose).
android.useAndroidX=true

# Each module's R class only contains its own resources (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style for IDE formatting.
kotlin.code.style=official
