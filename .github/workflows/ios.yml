# =============================================================================
# iOS CI — generates the Xcode project with XcodeGen, builds the app for the
# iOS Simulator, then runs the unit tests on an available iPhone simulator.
#
# No Supabase secrets are needed: without ios/Config/Secrets.xcconfig the
# Supabase settings are empty and the app shows its "Not configured" screen.
# Code signing is turned off (simulator builds don't need it).
# =============================================================================
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit test (Simulator)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Prefer the newest Xcode 16.x on the image (Swift 6.0/6.1 in Swift 5
      # mode — what this code is written against). If the image has none,
      # keep its default Xcode.
      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No Xcode 16.x found; using the default Xcode"
          fi

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # -quiet prints only warnings and errors, so a compile failure is easy
      # to find in the log.
      - name: Build app (generic iOS Simulator)
        run: |
          xcodebuild build \
            -quiet \
            -project MicTracker.xcodeproj \
            -scheme MicTracker \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Ask xcodebuild which simulators it can actually run with the
      # selected Xcode, and take an iPhone on the newest iOS (17+). Falls
      # back to `simctl` if that list can't be read.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          cat > "$RUNNER_TEMP/pick_simulator.py" <<'PY'
          import json
          import re
          import subprocess
          import sys


          def version_tuple(text):
              try:
                  return tuple(int(part) for part in text.split("."))
              except ValueError:
                  return None


          def from_showdestinations(path):
              """Lines look like:
              { platform:iOS Simulator, arch:arm64, id:ABC-123, OS:18.5, name:iPhone 16 }
              Only the "Available destinations" section counts."""
              best = None
              in_available = False
              with open(path, encoding="utf-8", errors="replace") as handle:
                  for line in handle:
                      if "Available destinations" in line:
                          in_available = True
                          continue
                      if "Ineligible destinations" in line:
                          in_available = False
                          continue
                      if not in_available:
                          continue
                      match = re.search(r"\{(.*)\}", line)
                      if not match:
                          continue
                      fields = {}
                      for part in match.group(1).split(", "):
                          if ":" in part:
                              key, value = part.split(":", 1)
                              fields[key.strip()] = value.strip()
                      if fields.get("platform") != "iOS Simulator":
                          continue
                      name = fields.get("name", "")
                      version = version_tuple(fields.get("OS", ""))
                      if not name.startswith("iPhone") or version is None or version < (17, 0):
                          continue
                      if best is None or version > best[0]:
                          best = (version, fields["id"], name)
              return best


          def from_simctl():
              output = subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  check=True, capture_output=True, text=True,
              ).stdout
              best = None
              for runtime, devices in json.loads(output).get("devices", {}).items():
                  match = re.search(r"iOS-(\d+)-(\d+)", runtime)
                  if not match:
                      continue
                  version = (int(match.group(1)), int(match.group(2)))
                  if version < (17, 0):
                      continue
                  for device in devices:
                      name = device.get("name", "")
                      if name.startswith("iPhone") and device.get("isAvailable", True):
                          if best is None or version > best[0]:
                              best = (version, device["udid"], name)
                          break
              return best


          best = from_showdestinations(sys.argv[1]) or from_simctl()
          if best is None:
              sys.exit("No available iPhone simulator with iOS 17+ found")
          print("Using %s (iOS %s)" % (best[2], ".".join(str(n) for n in best[0])), file=sys.stderr)
          print(best[1])
          PY
          xcodebuild -project MicTracker.xcodeproj -scheme MicTracker -showdestinations \
            > "$RUNNER_TEMP/destinations.txt" 2>&1 || true
          cat "$RUNNER_TEMP/destinations.txt"
          UDID=$(python3 "$RUNNER_TEMP/pick_simulator.py" "$RUNNER_TEMP/destinations.txt")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MicTracker.xcodeproj \
            -scheme MicTracker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/TestResults.xcresult
          if-no-files-found: ignore

  # The owner builds on their own Mac with whatever Xcode the App Store has
  # (often newer than 16.x), for a real iPhone. Check that combination too:
  # newest Xcode on the image, device build, a sample Secrets.xcconfig like
  # ios/setup.sh writes. No signing on CI.
  device-build-latest-xcode:
    name: Device build (newest Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Sample Secrets.xcconfig (same shape ios/setup.sh writes)
        run: |
          cat > Config/Secrets.xcconfig <<'XC'
          SUPABASE_URL = https:/$()/example.supabase.co
          SUPABASE_ANON_KEY = ci-placeholder-key
          MIC_TRACKER_BUNDLE_ID = com.comedyplatform.mictracker.ci
          DEVELOPMENT_TEAM =
          XC

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (generic iOS device)
        run: |
          xcodebuild build \
            -quiet \
            -project MicTracker.xcodeproj \
            -scheme MicTracker \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the settings reached the app
        run: |
          PLIST=$(find build/DerivedData/Build/Products -name Info.plist -path '*MicTracker.app/*' | head -n 1)
          /usr/libexec/PlistBuddy -c 'Print :SupabaseURL' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SupabaseURL' "$PLIST")" = "https://example.supabase.co"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.comedyplatform.mictracker.ci"

  # An unsigned iPhone app (.ipa) for installing from a Windows PC with
  # Sideloadly, which signs it with the owner's free Apple ID. Built with
  # the real Supabase settings from the SUPABASE_URL / SUPABASE_ANON_KEY
  # repository secrets (the app shows "Not configured" without them).
  iphone-ipa:
    name: iPhone app for sideloading (.ipa)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same file ios/setup.sh writes on a Mac. Quotes and spaces pasted
      # into the secrets are dropped; `//` becomes `/$()/` because xcconfig
      # treats // as a comment.
      - name: Write Secrets.xcconfig from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url=$(printf '%s' "$SUPABASE_URL" | tr -d "\"' \t\r\n")
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d "\"' \t\r\n")
          url=${url%/}
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing; the app will open on 'Not configured' (demo still works)."
          fi
          {
            echo "SUPABASE_URL = $(printf '%s' "$url" | sed 's#//#/$()/#')"
            echo "SUPABASE_ANON_KEY = $key"
          } > Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild build \
            -quiet \
            -project MicTracker.xcodeproj \
            -scheme MicTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Check the Supabase URL reached the app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/MicTracker.app
          got=$(/usr/libexec/PlistBuddy -c 'Print :SupabaseURL' "$APP/Info.plist")
          case "$got" in
            https://*.supabase.co) echo "Supabase URL is set." ;;
            "") echo "::warning::No Supabase URL in this build (secrets missing)." ;;
            *) echo "::error::Supabase URL looks wrong in the build"; exit 1 ;;
          esac

      - name: Package MicTracker.ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/MicTracker.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../MicTracker.ipa Payload)
          ls -lh build/MicTracker.ipa

      - name: Upload MicTracker.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MicTracker-iphone-ipa
          path: ios/build/MicTracker.ipa
          if-no-files-found: error
