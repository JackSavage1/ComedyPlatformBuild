# Nightly scrape: fills the phone apps' "Import from Scrapers" queue.
#
# Runs scripts/run_scrapers.py once a day: scrapes Bad Slava + FireMics,
# queues mics you don't have yet in the scraped_mics table, logs each run in
# scrape_log, and geocodes mics missing map coordinates.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions),
# the same values as the [database] section of .streamlit/secrets.toml:
#   SUPABASE_DB_HOST, SUPABASE_DB_PORT, SUPABASE_DB_NAME,
#   SUPABASE_DB_USER, SUPABASE_DB_PASSWORD
# Without SUPABASE_DB_HOST the job skips itself (green, with a notice), so
# forks and repos without secrets don't fail every night.
# See docs/MOBILE_SETUP.md, step 8.

name: Nightly scrape

on:
  schedule:
    # 14:07 UTC every day (10:07 AM in New York during daylight time,
    # 9:07 AM in winter). Odd minute on purpose: GitHub is busiest at :00.
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: scrape and print what would be queued, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two scrapes overlap (e.g. a manual run during the nightly one).
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      # Secrets can't be tested directly in `if:`, so check the env var here
      # and let the later steps read this step's output.
      - name: Check database secrets
        id: config
        run: |
          if [ -z "$SUPABASE_DB_HOST" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::notice title=Nightly scrape skipped::The SUPABASE_DB_HOST repository secret is not set, so there is no database to write to. Add the SUPABASE_DB_* secrets (docs/MOBILE_SETUP.md, step 8) to turn the nightly scrape on."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the code
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrapers
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/run_scrapers.py --dry-run
          else
            python scripts/run_scrapers.py
          fi
