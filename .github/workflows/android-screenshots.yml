# Android screenshots: builds the debug APK, boots an emulator, opens every
# screen of docs/MOBILE_SPEC.md section 8.3 in demo mode (dark mode, clean
# status bar) and commits the PNGs to docs/screenshots/android/ on the same
# branch.
#
# Run it by hand from the Actions tab ("Run workflow"). No secrets needed:
# demo mode runs on sample data bundled in the app.
#
# The capture logic lives in android/scripts/take_screenshots.sh (it also
# works locally against any running emulator).

name: Android screenshots

on:
  workflow_dispatch:

permissions:
  contents: write # to push the screenshots back

# Two runs on the same branch would race to push; let them queue instead.
concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history so "git pull --rebase" works if the branch moved on.
          fetch-depth: 0

      # The Android emulator needs hardware acceleration; this lets the runner
      # user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      # Boots a Pixel 7 emulator (Android 14), runs the script, shuts it down.
      # The `script` input runs each line separately with `sh`, so it's one call.
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/scripts/take_screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: docs/screenshots/android
          if-no-files-found: error

      - name: Upload emulator log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-logs
          path: android/build/screenshot-logs
          if-no-files-found: ignore

      - name: Commit and push the screenshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898209+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android
          if git diff --cached --quiet; then
            echo "Screenshots unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update Android screenshots [skip ci]"
          # Someone may have pushed meanwhile: rebase onto the branch and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Pushed the screenshots to $BRANCH."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in $((attempt * 10)) s..."
            sleep $((attempt * 10))
          done
          echo "::error::Couldn't push the screenshots after 3 attempts."
          exit 1
