# =============================================================================
# iOS screenshots — builds the app, runs it in the iOS Simulator in DEMO MODE
# and saves one PNG per screen to docs/screenshots/ios/, then commits them
# back to the branch the workflow was started on.
#
# Run it by hand: Actions → "iOS screenshots" → Run workflow → pick a branch.
#
# Each screen is opened with launch arguments the app reads at startup
# (ios/MicTracker/App/LaunchOptions.swift, docs/MOBILE_SPEC.md §8.3):
#     -demo YES -screen <name>        (sign-in uses -screen sign-in only)
# Screenshots are taken in dark mode with a clean 9:41 status bar.
# =============================================================================
name: iOS screenshots

on:
  workflow_dispatch:
  # GitHub only lists a dispatch-only workflow once it is on the default
  # branch, so a push whose commit message contains [screenshots] also
  # starts it (see the job's `if:`). Other pushes skip the job.
  push:

permissions:
  contents: write

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture simulator screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      BUNDLE_ID: com.comedyplatform.mictracker
      SHOTS_DIR: docs/screenshots/ios
      APP_PATH: ios/build/DerivedData/Build/Products/Debug-iphonesimulator/MicTracker.app
      # The table in docs/MOBILE_SPEC.md §8.3, in order: file NN-<name>.png.
      SCREENS: >-
        sign-in tonight calendar calendar-filters mic-detail map sets-log
        sets-history set-detail stats stats-charts manage import mic-form

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so `git pull --rebase` before pushing is painless.
          fetch-depth: 0

      # Same as ios.yml: the newest Xcode 16.x on the image, else the default.
      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No Xcode 16.x found; using the default Xcode"
          fi

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Like ios.yml, ask xcodebuild which simulators the selected Xcode can
      # run, then prefer an "iPhone 17 Pro", then an "iPhone 16 Pro", then
      # any other Pro, then any iPhone — each on the newest iOS (17+).
      - name: Pick an iPhone simulator
        id: simulator
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/pick_simulator.py" <<'PY'
          import json
          import re
          import subprocess
          import sys

          PREFERRED = ["iPhone 17 Pro", "iPhone 16 Pro"]


          def version_tuple(text):
              try:
                  return tuple(int(part) for part in text.split("."))
              except ValueError:
                  return None


          def from_showdestinations(path):
              """(version, name, udid) for every iPhone in "Available destinations"."""
              found = []
              in_available = False
              with open(path, encoding="utf-8", errors="replace") as handle:
                  for line in handle:
                      if "Available destinations" in line:
                          in_available = True
                          continue
                      if "Ineligible destinations" in line:
                          in_available = False
                          continue
                      if not in_available:
                          continue
                      match = re.search(r"\{(.*)\}", line)
                      if not match:
                          continue
                      fields = {}
                      for part in match.group(1).split(", "):
                          if ":" in part:
                              key, value = part.split(":", 1)
                              fields[key.strip()] = value.strip()
                      if fields.get("platform") != "iOS Simulator":
                          continue
                      name = fields.get("name", "")
                      version = version_tuple(fields.get("OS", ""))
                      if not name.startswith("iPhone") or version is None or version < (17, 0):
                          continue
                      found.append((version, name, fields["id"]))
              return found


          def from_simctl():
              output = subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  check=True, capture_output=True, text=True,
              ).stdout
              found = []
              for runtime, devices in json.loads(output).get("devices", {}).items():
                  match = re.search(r"iOS-(\d+)-(\d+)", runtime)
                  if not match:
                      continue
                  version = (int(match.group(1)), int(match.group(2)))
                  if version < (17, 0):
                      continue
                  for device in devices:
                      name = device.get("name", "")
                      if name.startswith("iPhone") and device.get("isAvailable", True):
                          found.append((version, name, device["udid"]))
              return found


          def rank(candidate):
              version, name, _ = candidate
              if name in PREFERRED:
                  tier = PREFERRED.index(name)
              elif name.endswith(" Pro"):
                  tier = len(PREFERRED)
              else:
                  tier = len(PREFERRED) + 1
              return (tier, tuple(-number for number in version), name)


          candidates = from_showdestinations(sys.argv[1]) or from_simctl()
          if not candidates:
              sys.exit("No available iPhone simulator with iOS 17+ found")
          version, name, udid = min(candidates, key=rank)
          print("Using %s (iOS %s)" % (name, ".".join(str(n) for n in version)), file=sys.stderr)
          print(udid)
          PY
          xcodebuild -project MicTracker.xcodeproj -scheme MicTracker -showdestinations \
            > "$RUNNER_TEMP/destinations.txt" 2>&1 || true
          cat "$RUNNER_TEMP/destinations.txt"
          UDID=$(python3 "$RUNNER_TEMP/pick_simulator.py" "$RUNNER_TEMP/destinations.txt")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app for that simulator
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build \
            -quiet \
            -project MicTracker.xcodeproj \
            -scheme MicTracker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the app bundle
        run: |
          test -d "$APP_PATH" || { echo "::error::$APP_PATH was not built"; exit 1; }
          test -f "$APP_PATH/DemoData.json" || { echo "::error::DemoData.json is missing from the app bundle"; exit 1; }
          ls -la "$APP_PATH"

      - name: Boot and prepare the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true   # "already booted" is fine
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP_PATH"
          # Granted up front so no permission alert can cover the map.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID" \
            || echo "::warning::Couldn't pre-grant location permission"

      - name: Capture screenshots
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$SHOTS_DIR"
          rm -f "$SHOTS_DIR"/*.png

          # Run a command, but kill it after N seconds. simctl calls can hang
          # forever on a busy runner, which would stall the job for an hour.
          # (macOS has no `timeout` command, so this is the portable version.)
          with_timeout() {
            local secs=$1; shift
            "$@" &
            local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) &
            local watcher=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$watcher" 2>/dev/null || true
            wait "$watcher" 2>/dev/null || true
            if [ "$rc" -eq 137 ]; then echo "::warning::Timed out after ${secs}s: $*"; fi
            return "$rc"
          }

          # Warm-up: the first launch after install (and after boot) is slow.
          echo "▶ warm-up launch"
          with_timeout 90 xcrun simctl launch "$UDID" "$BUNDLE_ID" -demo YES || echo "::warning::Warm-up launch failed"
          sleep 15
          # Re-apply in case SpringBoard reset it while finishing the boot.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 \
            || echo "::warning::Couldn't re-apply the status bar override"

          index=0
          for screen in $SCREENS; do
            index=$((index + 1))
            file="$SHOTS_DIR/$(printf '%02d' "$index")-$screen.png"
            if [ "$screen" = "sign-in" ]; then
              args=(-screen sign-in)
            else
              args=(-demo YES -screen "$screen")
            fi
            # Map tiles need time to download; everything else is local.
            if [ "$screen" = "map" ]; then settle=10; else settle=4; fi

            with_timeout 30 xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            sleep 1
            echo "▶ $screen: ${args[*]}"
            with_timeout 60 xcrun simctl launch "$UDID" "$BUNDLE_ID" "${args[@]}" \
              || echo "::warning::Launch failed or timed out for '$screen'"
            sleep "$settle"
            running=$(with_timeout 20 xcrun simctl spawn "$UDID" launchctl list 2>/dev/null || true)
            if ! grep -q "$BUNDLE_ID" <<<"$running"; then
              echo "::warning::Mic Tracker doesn't seem to be running for '$screen' (crash?)"
            fi
            with_timeout 45 xcrun simctl io "$UDID" screenshot "$file" \
              || echo "::warning::Screenshot failed or timed out for '$screen'"
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: docs/screenshots/ios
          if-no-files-found: warn

      # Fail loudly if anything is missing or empty.
      - name: Check every screenshot exists
        run: |
          missing=0
          index=0
          for screen in $SCREENS; do
            index=$((index + 1))
            file="$SHOTS_DIR/$(printf '%02d' "$index")-$screen.png"
            if [ ! -s "$file" ]; then
              echo "::error::Missing screenshot: $file"
              missing=$((missing + 1))
            fi
          done
          ls -la "$SHOTS_DIR" || true
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing screenshot(s) missing"
            exit 1
          fi
          # Two identical images usually mean the app wasn't on screen.
          duplicates=$(shasum "$SHOTS_DIR"/*.png | awk '{print $1}' | sort | uniq -d | wc -l | tr -d ' ' || true)
          if [ "$duplicates" != "0" ]; then
            echo "::warning::Some screenshots are byte-identical — check them in the artifact."
          fi

      - name: Commit and push the screenshots
        if: github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898209+github-actions[bot]@users.noreply.github.com"
          git add "$SHOTS_DIR"
          if git diff --cached --quiet; then
            echo "Screenshots unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Update iOS screenshots [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Pushed the screenshots to $BRANCH"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $attempt of 3); retrying…"
            sleep $((attempt * 10))
          done
          echo "::error::Couldn't push the screenshots to $BRANCH"
          exit 1
