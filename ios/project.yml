# =============================================================================
# XcodeGen spec for the native iOS app.
#
# The .xcodeproj is GENERATED from this file and never committed:
#     brew install xcodegen
#     cd ios && xcodegen generate && open MicTracker.xcodeproj
#
# Supabase settings come from Config/Secrets.xcconfig (gitignored), included
# by Config/Base.xcconfig. See docs/MOBILE_SETUP.md.
# =============================================================================
name: MicTracker

options:
  bundleIdPrefix: com.comedyplatform
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MicTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Swift files are compiled; every other file under MicTracker/ is
      # copied into the app (XcodeGen's default "resources" phase) — that
      # includes Assets.xcassets and Resources/DemoData.json (demo mode,
      # generated by scripts/build_demo_data.py). The screenshot workflow
      # fails if DemoData.json is ever missing from the built app.
      - path: MicTracker
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      # Generated by `xcodegen generate` (gitignored).
      path: Info.plist
      properties:
        CFBundleDisplayName: Mic Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Mic Tracker shows your location on the open mic map so you can find mics near you.
        # Filled from Config/Base.xcconfig + Config/Secrets.xcconfig.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_NAME: MicTracker
        # Defaults to com.comedyplatform.mictracker (Config/Base.xcconfig);
        # ios/setup.sh gives each person a unique one in Secrets.xcconfig so
        # a free Apple ID can sign it.
        PRODUCT_BUNDLE_IDENTIFIER: $(MIC_TRACKER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  MicTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MicTrackerTests
    dependencies:
      - target: MicTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comedyplatform.mictracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MicTracker.app/MicTracker
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MicTracker:
    build:
      targets:
        MicTracker: all
        MicTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MicTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
